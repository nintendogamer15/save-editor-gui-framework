name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# P0 bootstrap: restore, build, and test on both supported platforms.
# P6 extends this workflow with the screenshot review gate, the manual
# Wayland job, packaging, and the accessibility checklist.
jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release
