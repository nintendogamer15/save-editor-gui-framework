name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# P0 bootstrap: restore, build, and test on both supported platforms.
# P6 extends this workflow with the screenshot review gate, the manual
# Wayland job, packaging, and the accessibility checklist.
jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      # Native deps the headless Skia renderer needs. Present on the current image,
      # installed explicitly so a future image change surfaces as a failed step rather
      # than as silently unrun UI tests.
      - name: Install headless rendering dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libfreetype6

      # Run the test executables directly rather than through `dotnet test`.
      # The dotnet test bridge reports success when tests *error* during host setup:
      # a missing native dependency left 87 headless tests unrun while it printed
      # Passed and exited 0. The runner itself reports Errors and exits non-zero.
      - name: Test
        id: test
        run: |
          dotnet exec tests/SaveEditor.Ui.Tests/bin/Release/net10.0/SaveEditor.Ui.Tests.dll
          dotnet exec tests/SaveEditor.Ui.HeadlessTests/bin/Release/net10.0/SaveEditor.Ui.HeadlessTests.dll
          dotnet exec tests/SaveEditor.Template.Tests/bin/Release/net10.0/SaveEditor.Template.Tests.dll

      # Section 12 requires a failing comparison to leave a reviewable artifact.
      # Without this the reviewer gets a pixel count and the images are discarded
      # with the runner, which is the least useful moment to have no picture.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs-${{ matrix.os }}
          path: |
            tests/SaveEditor.Ui.HeadlessTests/baselines/*.actual.png
            tests/SaveEditor.Ui.HeadlessTests/baselines/*.diff.png
          if-no-files-found: ignore
